version: "2"
linters:
  enable:
    - misspell
    - unconvert
  settings:
    govet:
      # fieldalignment: struct padding — not worth the noise at this stage.
      # shadow: flags idiomatic "if err := f(); err != nil" patterns.
      disable:
        - fieldalignment
        - shadow
      enable-all: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^sentinel-admin/
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - enterprise-llm-tracker
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^sentinel-admin/
